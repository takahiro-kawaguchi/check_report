<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>コンパイルエラーをスキャン中</title>
</head>

<body>
    <h1>スキャン中...</h1>
    <p id="log"></p>
    <div style="width: 100%; background-color: #eee; border-radius: 4px;">
        <div id="progress-bar" style="width: 0%; height: 20px; background-color: #4caf50; border-radius: 4px;"></div>
    </div>
    <p id="progress-text">0%</p>
    <h2>コンパイルエラー</h2>
    <ul id="errors"></ul>

    <script>
        const n_report = {{ num_reports }};
        const n_authors = {{ num_authors }};

        let total =n_authors.reduce((a, b) => a + b, 0);
        let checked = 0;

        function updateProgress() {
            const percent = Math.round((checked / total) * 100);
            document.getElementById("progress-bar").style.width = percent + "%";
            document.getElementById("progress-text").textContent = percent + "%" + " (" + checked + "/" + total + ")";
            if (checked === total) {
                document.getElementById("log").textContent = "完了しました";
            }
        }

        for (let i = 0; i < n_report; i++) {
            for (let j = 0; j < n_authors[i]; j++) {
                fetch(`/check_compile_error/${i}/${j}`)
                    .then(res => res.json())
                    .then(data => {
                        document.getElementById("log").innerHTML = "checking " + data.report + "/" + data.author + " is finished";
                        if (!data.success) {
                            const errors = document.getElementById("errors");
                            const li = document.createElement("li");
                            const a = document.createElement("a");
                            a.href = `/code/${i}/${j}/${data.code_num}`;
                            a.innerText = `${data.report}/${data.author}`;
                            li.appendChild(a);
                            errors.appendChild(li);
                        }
                        checked++;
                        updateProgress();
                    });
            }
        }
    </script>
</body>

</html>
