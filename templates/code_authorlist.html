<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/static/style.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
        crossorigin="anonymous"></script>
    <title>提出一覧- プログラミング成績ツール</title>
</head>

<body>
    <header>
        <nav class="fixed-top navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid">
                <div class="collapse navbar-collapse" id="navbarNav">

                    <ul class="navbar-nav">
                        <li class="nav-item"><a class="nav-link" href="/">課題一覧</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main class="container">
        <div class="row">
            <div class="col-12">
                <h1>{{report}}</h1>
                <ul>
                    {% for a in author_list %}
                    <li>
                        <a href="/code/{{report_index}}/{{loop.index0}}/0">{{a}}</a>
                            <span id="status-{{loop.index0}}" class="status-text text-secondary">
                                <i class="bi bi-arrow-repeat spin-icon"></i>
                            </span>
                    </li>
                    {% endfor %}
                </ul>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const total = {{ author_list|length }};
            for (let i = 0; i < total; i++) {
                fetch(`/check_finished/{{report_index}}/${i}`)
                    .then(response => response.json())
                    .then(data => {
                        const statusText = document.getElementById(`status-${i}`);
                        if (data.finished) {
                            statusText.innerHTML = '<i class="bi bi-check-square-fill"></i>';
                            statusText.classList.remove('text-secondary');
                            statusText.classList.add('text-success');
                        } else {
                            statusText.innerHTML = '';
                            statusText.classList.remove('text-secondary');
                        }
                    })
                    .catch(error => console.error('Error:', error));
            }
        });
    </script>
</body>

</html>
