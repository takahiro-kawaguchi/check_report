<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/static/style.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
        crossorigin="anonymous"></script>
    <title>プログラミング採点ツール</title>
</head>

<body>
    <main class="container">
        <div class="row">
            <div class="col-12">
                <h1>課題一覧</h1>
                [<a href="/edit_problems/common">共通問題編集</a>] [<a href="{{ url_for('reload_reports') }}">リスト再読み込み</a>]
                <ul>
                    {% for d in dirlist %}
                    <li><a href="/author/{{loop.index0}}">{{d}}</a>
                        <span id="status-{{loop.index0}}" class="status-text text-secondary">
                            <i class="bi bi-arrow-repeat spin-icon"></i>
                        </span>
                        [<a href="/edit_problems/{{loop.index0}}?prevpage='/'">問題編集</a>]
                        [<a href="/edit_inputs/{{loop.index0}}?prevpage='/'">入力編集</a>]
                        [<a href="/edit_sample/{{loop.index0}}?prevpage='/'">模範解答入力</a>]
                    </li>
                    {% endfor %}
                </ul>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const total = {{ dirlist|length }};
            for (let i = 0; i < total; i++) {
                fetch(`check_finished/${i}`)
                    .then(response => response.json())
                    .then(data => {
                        const statusText = document.getElementById(`status-${i}`);
                        if (data.finished) {
                            statusText.innerHTML = '<i class="bi bi-check-square-fill"></i>';
                            statusText.classList.remove('text-secondary');
                            statusText.classList.add('text-success');
                        } else {
                            statusText.innerHTML = '';
                            statusText.classList.remove('text-secondary');
                        }
                    })
                    .catch(error => console.error('Error:', error));
            }
        });
    </script>

</body>

</html>
